services:
  mailgate:
    build: .
    image: mailgate:0.1.0
    container_name: mailgate
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Mount only needed for multi-tenant (clients.json) mode:
    # volumes:
    #   - ./clients.json:/app/clients.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
